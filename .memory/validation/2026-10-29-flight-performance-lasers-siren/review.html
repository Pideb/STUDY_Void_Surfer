<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID SURFER · 개선 적용 확인</title><style>body{background:#08101b;color:#e2f2fb;margin:0;padding:24px;font:16px/1.6 system-ui}main{max-width:1440px;margin:auto}section{display:grid;grid-template-columns:1fr 1fr;gap:18px}img{width:100%;display:block;border:1px solid #34536c;border-radius:8px}figure{margin:0}figcaption,p{color:#adc7d9}h2{margin-top:36px}a{color:#85dfff}@media(max-width:750px){section{grid-template-columns:1fr}}</style><main><h1>VOID SURFER · 실제 개선 적용 화면</h1><p>프로덕션 엔진·렌더러·컨트롤러·HUD·CSS로 캡처했습니다. 재현용 중력 0/고정 난수와 로컬 인증·랭킹 예시 데이터를 사용했고, 외부 계정이나 DB는 변경하지 않았습니다.</p><h2>GUEST · NOVA만 사용 / 저장 기록 없음</h2><section><figure><img src="guest-menu-layout.png"><figcaption>로그인 없이 타이틀 진입</figcaption></figure><figure><img src="guest-hangar-layout.png"><figcaption>NOVA만 선택 가능, 게스트 최고 기록 제거</figcaption></figure><figure><img src="guest-ranking-layout.png"><figcaption>전체 랭킹은 조회, 개인 저장 기록은 표시하지 않음</figcaption></figure><figure><img src="guest-result-layout.png"><figcaption>이번 플레이 점수 2점만 표시, 개인 순위 빈 칸 제거</figcaption></figure><figure><img src="mobile-guest-hangar-layout.png"><figcaption>가로 모바일: 기체·설명 겹침 수정, 기존 세로 스크롤 유지</figcaption></figure><figure><img src="account-hangar-layout.png"><figcaption>로컬 인증 예시 계정: 최고 기록 100점 / 기존 해금 유지</figcaption></figure></section><h2>일반 / WARNING 줄 레이저</h2><section><figure><img src="ambient-normal-layout.png"><figcaption>보스 없이 일반 구간에서도 한 줄 예고</figcaption></figure><figure><img src="ambient-warning-two-layout.png"><figcaption>WARNING에서도 안전한 두 줄만 예고</figcaption></figure></section><h2>보스 진입과 배경 / 투사체</h2><section><figure><img src="boss-entry-layout.png"><figcaption>2.4초 사이렌·알림, 암전 중 기체는 표시</figcaption></figure><figure><img src="boss-stable-layout.png"><figcaption>벽 변속과 독립된 일정한 배경 이동</figcaption></figure><figure><img src="volley-spread-layout.png"><figcaption>기체·보스는 원래 화질, 투사체는 경량화, 예고선은 선명하게 유지</figcaption></figure></section><h2>렌더링
