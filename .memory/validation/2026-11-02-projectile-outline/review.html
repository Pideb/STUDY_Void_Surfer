<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투사체 외곽선 · 실제 렌더러 비교</title>
<style>body{margin:0;background:#09121f;color:#e4f2fa;font:16px/1.7 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:32px 24px}h1{font-size:30px;margin:0 0 12px}p{color:#abc0d0}label{display:inline-flex;align-items:center;gap:16px;margin:12px 0 24px}select{font:inherit;padding:10px;background:#152535;color:#e4f2fa;border:1px solid #476176;border-radius:6px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:40px}.comparison h2{grid-column:1/-1;margin:0;font-size:22px}figure{margin:0;min-width:0}img{width:100%;height:auto;display:block;border:1px solid #243f53}figcaption{padding:8px 0;color:#b3d8ed}a{color:#91e4f7}:focus-visible{outline:2px solid #91e4f7;outline-offset:4px}@media(max-width:700px){.comparison{grid-template-columns:1fr}main{padding:24px 16px}h1{font-size:24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head>
<body><main><h1>투사체 외곽선 비교</h1><p>실제 게임 렌더러와 원본 자산으로 만든 같은 장면의 전후 비교입니다. 크기·피격 판정·경로는 그대로이며 그림 실루엣에 테마색을 추가했습니다. 일반탄·분열 전 부모탄·반환 방향을 함께 표시합니다.</p><label>화면 조건<select id="size"><option value="mobile">모바일 844×390</option><option value="desktop">PC 1920×1080</option></select></label><div id="scenes"></div><p><a href="report.md">검증 기록</a> · 브라우저 에뮬레이션 캡처이며 실제 휴대폰 하드웨어의 FPS 검증은 아닙니다.</p></main>
<script>var stages=[['crystal-gates','수정 · 아이스 블루'],['industrial-void','산업 · 앰버'],['signal-monoliths','신호 · 일렉트릭 블루'],['gravity-well','중력 · 라벤더'],['abyssal-beast','심연 · 민트'],['solar-forge','태양 · 골드']];function render(){var size=document.getElementById('size').value;document.getElementById('scenes').innerHTML=stages.map(function(s){return '<section class="comparison"><h2>'+s[1]+'</h2>'+['before','after'].map(function(v){return '<figure><figcaption>'+(v==='before'?'변경 전':'외곽선 적용')+'</figcaption><img loading="lazy" src="'+s[0]+'-'+size+'-'+v+'.png" alt="'+s[1]+' '+(v==='before'?'변경 전':'외곽선 적용')+' 실제 렌더러 캡처"></figure>';}).join('')+'</section>';}).join('');}document.getElementById('size').addEventListener('change',render);render();</script></body></html>
