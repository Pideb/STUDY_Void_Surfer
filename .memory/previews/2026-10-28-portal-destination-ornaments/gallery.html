<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID SURFER · 목적지 포탈 6종</title><style>
:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif;background:#080e18;color:#edf4ff}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1500px;margin:auto}small{color:#85bfeb;letter-spacing:.16em}h1{font-size:28px;margin:10px 0}header p{color:#a5bad2;font-size:14px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:24px}article{border:1px solid #32435b;border-radius:10px;overflow:hidden;background:#0b1421}article header{padding:15px 18px 12px}h2{margin:0 0 6px;font-size:19px}article p{margin:0;color:#adc0d7;font-size:13px}canvas{display:block;width:100%;aspect-ratio:30/17}article a{display:block;color:#bee8ff;font-size:13px;padding:12px 18px;text-decoration:none;border-top:1px solid #26364c}article a:hover{background:#1b2b43}.note{color:#8ea6c0;font-size:13px;line-height:1.7;margin-top:20px}#status{color:#b7e8ff;font-size:13px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:14px}}
</style></head><body><main><header><small>VOID SURFER / DESTINATION PORTALS</small><h1>포탈 주변 조형물로 다음 지역 예고</h1><p>현재 배경 위에 다음 지역의 파편과 구조물이 먼저 나타나는 방향입니다. 포탈 안쪽은 비우고, 주변 조형물은 충돌 없는 장식으로 제안합니다.<br>이미 확정한 포탈 접근·백색 전환·장애물 재개 동작에 조형물만 추가한 검토용 시안입니다.</p></header><p id="status" role="status">6종 이미지 준비 중…</p><section class="grid" id="grid"></section><p class="note">각 그림의 ‘움직이는 전환 보기’를 열면 목적지를 선택해 실제 접근·통과 과정을 볼 수 있습니다. 생성된 그림은 시안용이며 게임에는 아직 적용하지 않았습니다.</p></main><script>
const stages=[['crystal-gates','수정','흩어진 수정 조각','#8bd7ff'],['industrial-void','산업','분리된 기계 장갑 · 부유 브래킷','#ffad58'],['signal-monoliths','신호','떠 있는 신호 석판 · 노드','#d49bff'],['gravity-well','중력','궤도 암석 · 초승달 파편','#be9bff'],['abyssal-beast','심해','생체 늑골 · 짧은 촉수','#62f1ee'],['solar-forge','태양','그을린 용광로 조각 · 불씨','#ffb24f']];
const cache=new Map();function img(src){if(!cache.has(src))cache.set(src,new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('이미지 로드 실패: '+src));i.src=src;}));return cache.get(src);}
async function card(s,index){
  const article=document.createElement('article');article.innerHTML=`<header><h2>${String(index+1).padStart(2,'0')} · ${s[1]}</h2><p>${s[2]}</p></header><canvas width="600" height="340" aria-label="${s[1]} 목적지 포탈 조형물"></canvas><a href="preview.html?to=${index}&from=${index===0?1:0}">움직이는 전환 보기 →</a>`;document.getElementById('grid').append(article);
  const c=article.querySelector('canvas').getContext('2d'),root='../../../public/assets/game/stages/';
  const [bg,next,frame,player]=await Promise.all([img(root+(index===0?'industrial-void':'crystal-gates')+'/background.png'),img(root+s[0]+'/background.png'),img(s[0]+'-ornaments.png'),img('../../../public/assets/game/aircraft/default.png')]);
  c.drawImage(bg,0,0,600,340);c.fillStyle='#020814aa';c.fillRect(0,0,600,340);
  const x=430,y=170,rx=34,ry=110,h=320,w=h*frame.width/frame.height;
  c.save();c.beginPath();c.rect(0,0,600,340);c.ellipse(x,y,rx+3,ry+2,0,0,Math.PI*2);c.clip('evenodd');c.drawImage(frame,x-w/2,y-h/2,w,h);c.restore();
  c.save();c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.clip();c.drawImage(next,0,0,600,340);c.fillStyle='#c8f5ff55';c.fillRect(0,0,600,340);c.restore();
  c.save();c.globalCompositeOperation='screen';c.shadowColor=s[3];c.shadowBlur=15;
  for(let j=0;j<3;j++){c.lineWidth=4-j;c.strokeStyle=j===2?'#effdff':s[3];c.globalAlpha=.25+j*.25;c.beginPath();c.ellipse(x,y,rx+j*2,ry+j*2,0,0,Math.PI*2);c.stroke();}c.restore();
  c.save();c.strokeStyle='#9defff';c.lineWidth=2.5;c.shadowColor='#66dbff';c.shadowBlur=9;c.beginPath();c.moveTo(100,170);c.lineTo(150,170);c.stroke();c.drawImage(player,150,155,43,30);c.restore();
}
Promise.all(stages.map(card)).then(()=>{document.getElementById('status').textContent='6종 준비 완료 · 그림은 현재 배경 + 다음 지역 조형물 조합';document.body.dataset.ready='true';}).catch(e=>{document.getElementById('status').textContent=e.message;});
</script></body></html>
