<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전역 레이저 안전·위험 표시 비교</title><style>*{box-sizing:border-box}body{margin:0;background:#060e18;color:#eaf6ff;font:16px system-ui}main{max-width:1440px;margin:auto;padding:20px}h1{font-size:26px}p{color:#b3ccdf;line-height:1.6}canvas{display:block;width:100%;height:auto}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,select{background:#142b3e;color:#eaf5ff;border:1px solid #547f98;padding:10px 14px;border-radius:4px;font:inherit}button{cursor:pointer}a{color:#a5e9ff}</style><main><h1>전역 레이저 · 안전 / 위험 지역 표시</h1><p>벽이 없는 실제 게임 배경과 기체 위에서 비교합니다. 아래 비교 이미지의 위쪽은 예고 중, 아래쪽은 발사 중입니다. 오른쪽에서 왼쪽으로 발사되는 기존 빛 표현은 유지했습니다.</p><nav><select id="style" aria-label="표시 방식"><option value="1">1 · 청록 안전 / 적색 사선 위험 (추천)</option><option value="2">2 · 안전 구역 집중 강조</option></select><select id="zone" aria-label="안전 구역 위치"><option value="0">맨 위 안전</option><option value="1" selected>위에서 두 번째 안전</option><option value="2">위에서 세 번째 안전</option><option value="3">맨 아래 안전</option></select><button id="play">애니메이션 정지</button><button id="warning">예고 상태</button><button id="active">발사 상태</button></nav><p id="status">이미지를 불러오는 중…</p><canvas id="scene" width="960" height="540"></canvas><h2>두 안 비교 · 같은 크기와 같은 상황</h2><canvas id="comparison" width="1920" height="1240"></canvas></main><script>addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent=String(e.reason));</script><script type="module" src="global-laser-review.mjs"></script></html>
