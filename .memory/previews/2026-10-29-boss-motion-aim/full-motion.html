<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID SURFER 보스 수직 이동 · 전체 화면 시안</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b15;color:#ecf6ff;font:14px system-ui}canvas{display:block;width:100vw;height:100dvh}.controls{position:fixed;top:12px;right:12px;z-index:2;display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:calc(100vw - 24px)}button,select{background:#071626d9;border:1px solid #6ea5bf80;color:#e9f6ff;padding:8px 10px;border-radius:4px;font:inherit}button{cursor:pointer}label{background:#071626d9;padding:7px;border-radius:4px}.status{position:fixed;left:12px;bottom:10px;color:#bfd5e7;background:#05101bbf;padding:6px 9px;pointer-events:none;font-size:12px}.info{position:fixed;inset:0;display:grid;place-items:center;background:#050b15;z-index:5}.info[hidden]{display:none}body.clean .controls,body.clean .status{display:none}body.clean:hover .controls{display:flex}@media(max-width:750px){.controls{font-size:11px;top:6px;right:6px;gap:4px}button,select{padding:5px}.status{font-size:10px}}</style>
<canvas id="scene" width="960" height="540" aria-label="보스가 실제 플레이 화면에서 위아래로 움직이는 시안"></canvas>
<div class="controls"><select id="stage" aria-label="스테이지"><option value="crystal-gates">수정</option><option value="industrial-void">산업</option><option value="signal-monoliths">신호</option><option value="gravity-well">중력</option><option value="abyssal-beast">심해</option><option value="solar-forge">태양</option></select><button id="pause">정지</button><button id="restart">처음부터</button><label><input id="guides" type="checkbox"> 이동 범위</label><button id="full">전체 화면</button><button id="clean">안내 숨기기</button></div>
<div class="status">시안 · 중심 높이 28~72% · 6초 왕복 · 기체/보스 크기 유지 · 충전 UI 80px</div><div class="info" id="loading">실제 게임 이미지를 불러오는 중…</div>
<script>function showError(error){const el=document.querySelector('#loading');el.hidden=false;el.textContent=String(error);fetch('/fullmotion/error',{method:'POST',body:JSON.stringify({error:String(error),stack:error?.stack})}).catch(()=>{});}addEventListener('error',e=>showError(e.error||e.message));addEventListener('unhandledrejection',e=>showError(e.reason));</script><script type="module" src="full-motion.mjs"></script></html>
