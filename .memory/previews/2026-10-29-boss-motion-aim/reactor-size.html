<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벽과 함께 보는 원자로 아크 크기</title><style>*{box-sizing:border-box}body{margin:0;background:#060e18;color:#e9f5ff;font:16px system-ui}main{max-width:1440px;margin:auto;padding:20px}h1{font-size:26px}p{color:#acc4d9;line-height:1.6}canvas,img{display:block;width:100%;height:auto}button{padding:10px 16px;margin:8px;background:#163448;color:#eaf9ff;border:1px solid #6b9cb4;border-radius:4px;cursor:pointer}a{color:#a7e8ff}details{margin:18px 0}summary{padding:10px;cursor:pointer}</style><main><h1>원자로 아크 · 벽과 함께 크기 비교</h1><p>세 안 모두 기체·벽·보스·플레이 공간 크기는 같습니다. 왼쪽은 같은 플레이 장면, 오른쪽은 하단의 같은 구역을 확대한 모습입니다. 실제 게임 렌더러 위에 후보 UI만 덧그린 시안이며 아직 게임에는 적용하지 않았습니다.</p><div><button id="charging">충전 중 72%</button><button id="ready">발사 준비 상태</button></div><p id="status">이미지를 불러오는 중…</p><canvas id="comparison" width="1440" height="1220"></canvas><details><summary>1번 작은 크기 · 전체 장면</summary><img src="reactor-small.png" alt="64px 원자로 아크 전체 장면"></details><details open><summary>2번 중간 크기 · 전체 장면</summary><img src="reactor-medium.png" alt="80px 원자로 아크 전체 장면"></details><details><summary>3번 큰 크기 · 전체 장면</summary><img src="reactor-large.png" alt="104px 원자로 아크 전체 장면"></details></main><script>addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent=String(e.reason));</script><script type="module" src="reactor-size.mjs"></script></html>
