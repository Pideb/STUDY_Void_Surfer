<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOID SURFER · 스테이지 BGM 시안</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; color: #eef4ff; background: #080d16; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 24px 64px; line-height: 1.6; }
    main { max-width: 1140px; margin: auto; }
    a { color: #a7d9ff; }
    .skip { position: absolute; top: -80px; }
    .skip:focus { top: 8px; }
    header { max-width: 820px; margin-bottom: 24px; }
    .eyebrow { color: #a7b5c9; font-size: 12px; letter-spacing: .16em; font-weight: 700; }
    h1 { margin: 8px 0 12px; font-size: clamp(28px, 5vw, 46px); line-height: 1.2; letter-spacing: -.04em; }
    header p { color: #aebbd0; margin: 0; }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
    button { background: #e1efff; color: #0a192c; padding: 10px 18px; border: 1px solid transparent; border-radius: 8px; font: inherit; font-weight: 650; cursor: pointer; }
    button.secondary { color: #dde8f8; background: #162031; border-color: #2b394e; }
    button:hover { filter: brightness(1.1); }
    button:focus-visible, a:focus-visible { outline: 3px solid #8ad8ff; outline-offset: 4px; }
    #play-status { color: #afc9df; font-size: 14px; min-height: 24px; }
    .tracks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    article { min-width: 0; border: 1px solid #273247; border-radius: 12px; overflow: hidden; background: #111a29; }
    article.is-playing { border-color: #aacbff; }
    .art { position: relative; height: 160px; background: #0b1322; overflow: hidden; }
    .art img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.66); }
    .number { position: absolute; top: 12px; left: 16px; color: #fff; font-size: 16px; font-weight: 700; }
    .stage { position: absolute; bottom: 14px; left: 16px; color: #fff; font-size: 18px; font-weight: 750; letter-spacing: .04em; text-shadow: 0 2px 6px #000; }
    .content { padding: 18px 20px 20px; }
    h2 { font-size: 23px; margin: 0 0 5px; line-height: 1.3; }
    .metadata { margin: 0 0 10px; color: #97acc7; font-size: 12px; letter-spacing: .03em; }
    .description { margin: 0 0 16px; font-size: 14px; color: #c0ccdc; min-height: 45px; }
    audio { display: block; width: 100%; height: 40px; }
    .download { display: inline-block; margin-top: 12px; font-size: 12px; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    footer { color: #93a4bc; font-size: 13px; margin-top: 28px; }
    @media (max-width: 640px) { body { padding: 24px 16px 40px; } .tracks { grid-template-columns: 1fr; } .description { min-height: 0; } }
    @media print { button, audio { display: none; } article { break-inside: avoid; } }
  </style>
</head>
<body>
  <a class="skip" href="#tracks">음악 목록으로 이동</a>
  <main>
    <header>
      <div class="eyebrow">VOID SURFER / SOUND STUDY 01</div>
      <h1>여섯 지역, 여섯 가지 비행감</h1>
      <p>스테이지별로 새로 작곡한 신스 BGM의 승인된 비교 시안입니다. 각 곡은 약 15~22초이며, 아래 재생 버튼으로 직접 들어볼 수 있습니다. 게임에는 같은 선율·음색의 반복 재생 버전이 적용되었습니다.</p>
    </header>
    <section aria-label="재생 도구">
      <div class="toolbar">
        <button id="play-all" type="button">6곡 이어 듣기</button>
        <button id="stop-all" class="secondary" type="button">전체 정지</button>
        <span id="play-status" role="status" aria-live="polite">듣고 싶은 곡의 ▶ 버튼을 눌러주세요.</span>
      </div>
    </section>
    <section id="tracks" class="tracks" aria-label="스테이지 BGM 샘플"></section>
    <footer>볼륨은 처음에 55%로 설정됩니다. 한 곡을 재생하면 다른 곡은 일시정지됩니다. WAV 파일을 내려받아 별도 플레이어에서도 들을 수 있습니다.</footer>
  </main>
  <script>
    const samples = __SAMPLES__;
    const grid = document.querySelector('#tracks');
    const status = document.querySelector('#play-status');
    let playlist = false;
    const players = samples.map((sample, index) => {
      const article = document.createElement('article');
      article.innerHTML = `<div class="art"><img alt="" src="../../../public/assets/game/stages/${sample.id}/background.png"><span class="number">0${index + 1}</span><span class="stage">${sample.id.replaceAll('-', ' ').toUpperCase()}</span></div><div class="content"><h2>${sample.title}</h2><p class="metadata">${sample.bpm} BPM · ${sample.durationSeconds.toFixed(1)}초 · 오리지널 신스</p><p class="description">${sample.description}</p><audio controls preload="metadata" aria-label="${sample.title} BGM 시안" src="${sample.file}">오디오 재생을 지원하는 브라우저에서 열어주세요.</audio><a class="download" href="${sample.file}" download>WAV 다운로드</a></div>`;
      const audio = article.querySelector('audio');
      audio.volume = 0.55;
      audio.addEventListener('play', () => {
        players.forEach((other) => { if (other !== audio) other.pause(); });
        article.classList.add('is-playing');
        status.textContent = `${playlist ? '이어 듣기 · ' : ''}0${index + 1} ${sample.title}`;
      });
      audio.addEventListener('pause', () => article.classList.remove('is-playing'));
      audio.addEventListener('ended', () => {
        article.classList.remove('is-playing');
        if (playlist && index + 1 < players.length) start(index + 1);
        else { playlist = false; status.textContent = '재생이 끝났습니다. 의견은 대화창에 남겨주세요.'; }
      });
      audio.addEventListener('error', () => {
        playlist = false;
        status.textContent = '오디오를 불러오지 못했습니다. preview.html과 WAV 파일이 같은 폴더에 있는지 확인해주세요.';
      });
      grid.append(article);
      return audio;
    });
    async function start(index) {
      const audio = players[index];
      audio.currentTime = 0;
      try { await audio.play(); }
      catch { playlist = false; status.textContent = '재생 버튼을 직접 눌러주세요. 브라우저가 자동 재생을 제한할 수 있습니다.'; }
    }
    document.querySelector('#play-all').addEventListener('click', () => { playlist = true; start(0); });
    document.querySelector('#stop-all').addEventListener('click', () => {
      playlist = false;
      players.forEach((audio) => { audio.pause(); audio.currentTime = 0; });
      status.textContent = '전체 정지';
    });
  </script>
</body>
</html>
